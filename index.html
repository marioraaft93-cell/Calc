<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>جدول الضرب — Arcade Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cabinet">
  <p class="title">*** جدول الضرب ***<br>ARCADE EDITION</p>
  <p class="subtitle">أهلاً بيك في جدول الضرب!</p>

  <div class="prompt-row">
    <label for="numInput">أدخل رقم:</label>
    <input type="number" id="numInput" placeholder="مثلاً 8">
    <button id="runBtn">▶ ابدأ</button>
  </div>

  <div class="screen" id="screen">
    <p class="hint">اكتب رقم واضغط "ابدأ" هنعرض جدول ضربه من ١ لحد ١٠ 🎮</p>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
