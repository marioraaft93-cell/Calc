<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>جدول الضرب — Arcade Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d0221;
    --bg-panel:#150634;
    --neon-pink:#ff2e88;
    --neon-cyan:#00fff5;
    --neon-purple:#7b2ff7;
    --amber:#ffd23f;
    --line:#241154;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(123,47,247,0.25), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,255,245,0.15), transparent 40%),
      var(--bg-deep);
    font-family:'VT323', monospace;
    color:var(--neon-cyan);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  /* scanline overlay for the arcade-screen feel */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events:none;
    z-index:5;
  }

  .cabinet{
    width:100%;
    max-width:560px;
    background:var(--bg-panel);
    border:3px solid var(--neon-purple);
    border-radius:14px;
    box-shadow:
      0 0 0 4px var(--bg-deep),
      0 0 24px rgba(123,47,247,0.6),
      0 0 60px rgba(0,255,245,0.15);
    padding:26px 24px 30px;
    position:relative;
  }

  .title{
    font-family:'Press Start 2P', monospace;
    font-size:16px;
    text-align:center;
    color:var(--amber);
    text-shadow:0 0 8px var(--amber), 0 0 20px rgba(255,210,63,0.5);
    letter-spacing:1px;
    margin:0 0 6px;
    line-height:1.6;
  }

  .subtitle{
    text-align:center;
    font-size:18px;
    color:var(--neon-pink);
    margin:0 0 20px;
    opacity:0.9;
  }

  .prompt-row{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
    flex-wrap:wrap;
  }

  .prompt-row label{
    font-size:20px;
    color:var(--neon-cyan);
  }

  input[type="number"]{
    width:110px;
    background:#05011a;
    border:2px solid var(--neon-cyan);
    color:var(--amber);
    font-family:'VT323', monospace;
    font-size:22px;
    text-align:center;
    border-radius:6px;
    padding:6px 8px;
    outline:none;
  }

  input[type="number"]:focus{
    border-color:var(--amber);
    box-shadow:0 0 10px var(--amber);
  }

  button{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    background:var(--neon-pink);
    color:#0d0221;
    border:none;
    border-radius:6px;
    padding:12px 16px;
    cursor:pointer;
    box-shadow:0 0 12px rgba(255,46,136,0.7);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }

  button:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 0 20px rgba(255,46,136,0.95);
  }

  button:active{
    transform:translateY(0) scale(0.97);
  }

  .screen{
    background:#05011a;
    border:2px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    min-height:60px;
    font-size:20px;
    line-height:1.55;
  }

  .banner{
    color:var(--amber);
    text-align:center;
    margin-bottom:8px;
    letter-spacing:1px;
  }

  .table-line{
    opacity:0;
    transform:translateX(-14px);
    color:var(--neon-cyan);
    display:flex;
    justify-content:space-between;
    padding:2px 4px;
    border-radius:4px;
  }

  .table-line.show{
    animation:popIn 0.28s ease forwards;
  }

  .table-line .res{
    color:var(--neon-pink);
    font-weight:bold;
  }

  .table-line.flash{
    background:rgba(0,255,245,0.12);
  }

  @keyframes popIn{
    0%{opacity:0; transform:translateX(-14px) scale(0.9);}
    60%{opacity:1; transform:translateX(2px) scale(1.05);}
    100%{opacity:1; transform:translateX(0) scale(1);}
  }

  .hint{
    text-align:center;
    font-size:15px;
    color:#7a6fb0;
    margin-top:6px;
  }

  .error{
    color:var(--neon-pink);
    text-align:center;
    font-size:18px;
  }

  @media (prefers-reduced-motion: reduce){
    .table-line{ animation:none !important; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <p class="title">*** جدول الضرب ***<br>ARCADE EDITION</p>
  <p class="subtitle">أهلاً بيك في جدول الضرب!</p>

  <div class="prompt-row">
    <label for="numInput">أدخل رقم:</label>
    <input type="number" id="numInput" placeholder="مثلاً 8">
    <button id="runBtn">▶ ابدأ</button>
  </div>

  <div class="screen" id="screen">
    <p class="hint">اكتب رقم واضغط "ابدأ" هنعرض جدول ضربه من ١ لحد ١٠ 🎮</p>
  </div>
</div>

<script>
  // ---------- Sound engine (Web Audio API, no external files) ----------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  function ctx(){
    if(!actx) actx = new AudioCtx();
    return actx;
  }

  function beep(freq, duration, type='square', vol=0.05, delay=0){
    const a = ctx();
    const t0 = a.currentTime + delay;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playStartJingle(){
    beep(440, 0.09, 'square', 0.06, 0);
    beep(660, 0.09, 'square', 0.06, 0.09);
    beep(880, 0.14, 'square', 0.06, 0.18);
  }

  function playRowTick(i){
    // pitch rises slightly with each row for a satisfying climb
    const freq = 300 + i * 25;
    beep(freq, 0.06, 'square', 0.045);
  }

  function playDoneChime(){
    beep(523, 0.08, 'triangle', 0.05, 0);
    beep(659, 0.08, 'triangle', 0.05, 0.08);
    beep(784, 0.16, 'triangle', 0.06, 0.16);
  }

  function playError(){
    beep(140, 0.2, 'sawtooth', 0.06);
  }

  // ---------- Same logic as the Python program ----------
  // print("***Welcome to the multiplication table***")
  // number = int(input("Enter a number:\n"))
  // print(f"multiplication table for {number}:\n")
  // for i in range(1, 11):
  //     result = number * i
  //     print(f"{number} x {i} = {result}")

  const screen = document.getElementById('screen');
  const input = document.getElementById('numInput');
  const btn = document.getElementById('runBtn');

  function runProgram(){
    const raw = input.value.trim();
    const number = parseInt(raw, 10);

    screen.innerHTML = '';

    if(raw === '' || isNaN(number)){
      playError();
      const err = document.createElement('p');
      err.className = 'error';
      err.textContent = '⚠ لازم تكتب رقم صحيح الأول!';
      screen.appendChild(err);
      input.focus();
      return;
    }

    playStartJingle();

    const banner = document.createElement('p');
    banner.className = 'banner';
    banner.textContent = `جدول الضرب لـ ${number}:`;
    screen.appendChild(banner);

    // for i in range(1, 11)
    for(let i = 1; i <= 10; i++){
      const result = number * i;
      const line = document.createElement('div');
      line.className = 'table-line';
      line.innerHTML = `<span>${number} × ${i}</span><span class="res">= ${result}</span>`;
      screen.appendChild(line);

      // stagger the reveal + tick sound for a "typing" arcade feel
      setTimeout(((el, idx) => () => {
        el.classList.add('show', 'flash');
        playRowTick(idx);
        setTimeout(() => el.classList.remove('flash'), 180);
      })(line, i), i * 160);
    }

    setTimeout(playDoneChime, 10 * 160 + 100);
  }

  btn.addEventListener('click', runProgram);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runProgram();
  });
</script>

</body>
</html>
